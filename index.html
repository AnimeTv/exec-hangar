</script></head><body><style id="mc-style">:root{
  /* Layout: hangar control console. Emblem cycle dial beside the lamp panel and readouts, a full-width cycle rail, then an ops deck of four plates. Single dark look by design (hangar screen / stream overlay). */
  color-scheme: dark;
  --hull:#080c0e;
  --hull-2:#0c1215;
  --plate:#0f161a;
  --plate-2:#141d22;
  --plate-3:#1a252b;
  --edge:#27353c;
  --edge-hi:#3e525b;
  --rule:#1c282e;
  --chrome:#e4ebed;
  --steel:#a0afb6;
  --steel-dim:#6f8189;
  --bezel-hi:#8c9ca3;
  --bezel-mid:#4f5e65;
  --bezel-lo:#1b2328;
  --glass-off:#0d1418;
  --glass-deep:#05090b;
  --shadow:rgba(0,0,0,.55);
  --sheen:rgba(255,255,255,.07);
  --signal:#4dff3c;
  --signal-core:#c6ffb2;
  --signal-deep:#1b8f12;
  --signal-glow:rgba(77,255,60,.5);
  --signal-soft:rgba(77,255,60,.11);
  --alert:#ff3d2e;
  --alert-core:#ffc0b6;
  --alert-deep:#8f170e;
  --alert-glow:rgba(255,61,46,.5);
  --alert-soft:rgba(255,61,46,.11);
  --caution:#ffb21c;
  --caution-glow:rgba(255,178,28,.45);
  --caution-soft:rgba(255,178,28,.12);
  --on-chrome:#0b1013;
  --phase:var(--signal);
  --phase-glow:var(--signal-glow);
  --phase-soft:var(--signal-soft);
  --font-display:'Big Shoulders Stencil','Big Shoulders Stencil Display','Barlow Semi Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Barlow Semi Condensed','Barlow','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cut:14px;
  --gutter:clamp(16px,3.2vw,36px);
  --lamp:clamp(46px,7.4vw,86px);
}
[data-phase="open"]{--phase:var(--signal);--phase-glow:var(--signal-glow);--phase-soft:var(--signal-soft)}
[data-phase="charging"]{--phase:var(--alert);--phase-glow:var(--alert-glow);--phase-soft:var(--alert-soft)}
[data-phase="reset"]{--phase:var(--caution);--phase-glow:var(--caution-glow);--phase-soft:var(--caution-soft)}

html,body{background:var(--hull)}
body{overflow-x:clip}
body{
  color:var(--chrome);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 560px at 12% -8%, var(--phase-soft), transparent 62%),
    radial-gradient(900px 520px at 100% 0%, var(--sheen), transparent 60%),
    repeating-linear-gradient(90deg, var(--sheen) 0 1px, transparent 1px 4px),
    var(--hull);
  background-attachment:fixed;
  transition:background-color .6s;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chrome);outline-offset:3px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--steel)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{max-width:1320px;margin:0 auto;padding-inline:var(--gutter);padding-block:0 40px;display:grid;gap:clamp(16px,2.4vw,28px)}

/* ── top bar ───────────────────────────── */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
  padding-block:12px;
  margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);
}
.topbar::before{content:"";position:absolute;z-index:-1;top:0;bottom:-14px;left:50%;width:100vw;transform:translateX(-50%);background:linear-gradient(180deg,var(--hull) 62%,transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.brand-mark{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 0 10px var(--phase-soft))}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.brand-sub{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clocks{display:flex;gap:18px}
.clock{display:grid;line-height:1.15}
.clock-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel-dim)}
.clock-val{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:8px 12px;border:1px solid var(--edge);background:var(--plate-2);color:var(--steel);
  font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  transition:color .2s,border-color .2s,background .2s;
}
.tool:hover{color:var(--chrome);border-color:var(--edge-hi)}
.tool[aria-pressed="true"]{color:var(--signal);border-color:var(--signal-deep);background:var(--signal-soft)}
.tool svg{width:18px;height:18px;flex:none}
.tool .lbl{white-space:nowrap}

/* ── plates ────────────────────────────── */
.plate{
  position:relative;
  background:linear-gradient(180deg,var(--plate-2),var(--plate)) padding-box, linear-gradient(180deg,var(--edge-hi),var(--edge) 30%,var(--rule)) border-box;
  border:1px solid transparent;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}
.plate::before,.plate::after{content:"";position:absolute;width:calc(var(--cut) * 1.42);height:1px;background:var(--edge-hi);pointer-events:none}
.plate::before{left:0;top:var(--cut);transform-origin:0 0;transform:rotate(-45deg)}
.plate::after{right:0;bottom:var(--cut);transform-origin:100% 100%;transform:rotate(-45deg)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--bezel-hi),var(--bezel-lo) 70%);box-shadow:inset 0 0 0 1px var(--shadow)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:var(--shadow);transform:rotate(35deg)}

/* ── console ───────────────────────────── */
.console{display:grid;grid-template-columns:minmax(260px,430px) minmax(0,1fr);gap:clamp(20px,3.5vw,56px);align-items:center;padding-block:8px 0}
.dial-wrap{position:relative;width:100%;max-width:430px;aspect-ratio:1;justify-self:center}
.dial{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial-logo{position:absolute;left:50%;top:50%;width:63%;transform:translate(-50%,-52%);filter:drop-shadow(0 8px 24px var(--shadow)) drop-shadow(0 0 22px var(--phase-soft));transition:filter .8s}
[data-phase="open"] .dial-logo{animation:emblemPulse 3.6s ease-in-out infinite}
@keyframes emblemPulse{50%{filter:drop-shadow(0 8px 24px var(--shadow)) drop-shadow(0 0 34px var(--signal-glow))}}
.dial .bezel{fill:none;stroke:var(--edge);stroke-width:2}
.dial .bezel-in{fill:none;stroke:var(--rule);stroke-width:1}
.dial .seg{fill:none;stroke-width:13;stroke-linecap:butt;opacity:.3;transition:opacity .4s,filter .4s}
.dial .seg.open{stroke:var(--signal)}
.dial .seg.reset{stroke:var(--caution)}
.dial .seg.charging{stroke:var(--alert)}
.dial .seg.past{opacity:.62}
.dial .seg.now{opacity:1;filter:drop-shadow(0 0 6px var(--phase-glow))}
.dial .tick{stroke:var(--steel-dim);stroke-width:1.2}
.dial .tick.major{stroke:var(--steel);stroke-width:2}
.dial .prog{fill:none;stroke:var(--phase);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--phase-glow))}
.dial .prog-track{fill:none;stroke:var(--rule);stroke-width:3}
.dial .needle line{stroke:var(--chrome);stroke-width:2.5}
.dial .needle circle{fill:var(--phase);stroke:var(--hull);stroke-width:2;filter:drop-shadow(0 0 6px var(--phase-glow))}
.dial .arc-label{fill:var(--steel);font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.dial-caption{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel-dim)}
.dial-caption b{color:var(--steel);font-weight:500;font-family:var(--font-data);letter-spacing:.02em}

.status{display:grid;gap:18px;min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.phase-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 8px;border:1px solid var(--phase);color:var(--phase);background:var(--phase-soft);font-weight:700;letter-spacing:.18em}
.phase-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--phase);box-shadow:0 0 8px var(--phase-glow);animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.headline{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(46px,7vw,92px);line-height:.88;letter-spacing:.015em;text-transform:uppercase;color:var(--phase);text-wrap:balance;text-shadow:0 0 28px var(--phase-soft)}
.advice{margin:0;max-width:60ch;font-size:clamp(16px,1.5vw,18px);color:var(--chrome)}
.advice b{color:var(--phase);font-weight:600}

.lamp-panel{padding:30px clamp(18px,3vw,34px) 18px;display:grid;gap:14px}
.lamp-panel .screw:nth-of-type(1){left:10px;top:10px}
.lamp-panel .screw:nth-of-type(2){right:10px;top:10px}
.lamp-panel .screw:nth-of-type(3){left:10px;bottom:10px}
.lamp-panel .screw:nth-of-type(4){right:10px;bottom:10px}
.panel-label{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--steel-dim)}
.panel-label span:last-child{text-align:right}
.hazard{position:absolute;left:0;right:0;top:0;height:8px;opacity:0;background:repeating-linear-gradient(-45deg,var(--caution) 0 10px,var(--hull) 10px 20px);background-size:28.28px 100%;transition:opacity .4s}
[data-phase="reset"] .hazard{opacity:1;animation:hazard 1s linear infinite}
@keyframes hazard{to{background-position:28.28px 0}}
.lamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,2vw,22px);justify-items:center}
.lamp-slot{display:grid;justify-items:center;gap:10px;width:100%}
.lamp{position:relative;width:var(--lamp);max-width:100%;aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle,transparent 60%,var(--shadow) 61%,transparent 66%),
    conic-gradient(from 210deg,var(--bezel-mid),var(--bezel-lo) 22%,var(--bezel-hi) 44%,var(--bezel-lo) 64%,var(--bezel-hi) 84%,var(--bezel-mid));
  box-shadow:0 8px 20px var(--shadow),inset 0 0 0 1px var(--shadow)}
.lamp-glass{position:absolute;inset:15%;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,var(--sheen),transparent 34%),radial-gradient(circle at 50% 56%,var(--glass-off),var(--glass-deep) 78%);
  box-shadow:inset 0 3px 9px var(--shadow);transition:background .35s,box-shadow .35s}
.lamp[data-c="g"] .lamp-glass{
  background:radial-gradient(circle at 36% 30%,var(--signal-core),transparent 30%),radial-gradient(circle at 50% 50%,var(--signal-core) 0,var(--signal) 40%,var(--signal-deep) 100%);
  box-shadow:inset 0 -5px 12px var(--shadow),0 0 18px var(--signal-glow),0 0 52px var(--signal-glow)}
.lamp[data-c="r"] .lamp-glass{
  background:radial-gradient(circle at 36% 30%,var(--alert-core),transparent 30%),radial-gradient(circle at 50% 50%,var(--alert-core) 0,var(--alert) 42%,var(--alert-deep) 100%);
  box-shadow:inset 0 -5px 12px var(--shadow),0 0 16px var(--alert-glow),0 0 44px var(--alert-glow)}
.lamp-ring{position:absolute;inset:-10px;border-radius:50%;opacity:0;transition:opacity .3s;
  background:conic-gradient(var(--ring,var(--chrome)) calc(var(--p,0) * 1turn),var(--rule) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.lamp.is-next .lamp-ring{opacity:1}
.lamp.flip .lamp-glass{animation:flip .7s steps(1,end)}
@keyframes flip{0%{opacity:.2}15%{opacity:1}30%{opacity:.35}45%{opacity:1}}
.lamp-no{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.1em;color:var(--steel-dim)}

.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.readout{padding:16px 18px 14px;display:grid;gap:4px;min-width:0}
.ro-label{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}
.ro-val{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(34px,4.2vw,56px);line-height:1;letter-spacing:-.02em;color:var(--chrome)}
.readout.primary .ro-val{color:var(--phase);text-shadow:0 0 22px var(--phase-soft)}
.ro-sub{font-size:14.5px;color:var(--steel);min-height:1.45em}

/* ── cycle rail ────────────────────────── */
.rail{padding:18px clamp(16px,2.4vw,26px) 16px;display:grid;gap:12px}
.rail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.rail-head h2,.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.rail-head span{font-size:13px;color:var(--steel);letter-spacing:.04em}
.track-wrap{position:relative;padding-top:22px}
.track{display:flex;height:42px;gap:2px}
.tseg{position:relative;flex:var(--w) 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden;opacity:.5;transition:opacity .3s}
.tseg.open{background:linear-gradient(180deg,var(--signal-soft),transparent),var(--plate-3);box-shadow:inset 0 2px 0 var(--signal-deep)}
.tseg.reset{background:repeating-linear-gradient(-45deg,var(--caution-soft) 0 6px,transparent 6px 12px),var(--plate-3);box-shadow:inset 0 2px 0 var(--caution)}
.tseg.charging{background:linear-gradient(180deg,var(--alert-soft),transparent),var(--plate-3);box-shadow:inset 0 2px 0 var(--alert-deep)}
.tseg.past{opacity:.8}
.tseg.now{opacity:1}
.tseg .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:var(--phase-soft);border-right:1px solid var(--phase)}
.dot{position:relative;width:6px;height:6px;border-radius:50%;background:var(--glass-off);box-shadow:inset 0 0 0 1px var(--edge)}
.dot.g{background:var(--signal);box-shadow:0 0 5px var(--signal-glow)}
.dot.r{background:var(--alert);box-shadow:0 0 5px var(--alert-glow)}
.tseg.tight .dot{display:none}
.cursor{position:absolute;top:0;bottom:-4px;width:2px;background:var(--chrome);box-shadow:0 0 8px var(--sheen);transform:translateX(-1px);pointer-events:none}
.cursor span{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--on-chrome);background:var(--chrome);padding:1px 6px 0;white-space:nowrap}
.axis{position:relative;height:36px;font-size:13px;color:var(--steel)}
.axis div{position:absolute;top:2px;white-space:nowrap;line-height:1.2}
.axis div b{display:block;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel-dim)}
.axis .ax-end{right:0;text-align:right}

/* ── deck ──────────────────────────────── */
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);align-items:start}
.card{padding:22px clamp(16px,2.4vw,26px) 22px;display:grid;gap:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.card p{margin:0}
.lede{color:var(--steel);max-width:62ch}

.sched{display:grid;gap:0;margin:0;padding:0;list-style:none}
.sched li{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.sched li:first-child{border-top:0}
.sched .day{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.sched .win{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:17px}
.sched .win span{color:var(--steel-dim)}
.sched .rel{font-size:14px;color:var(--steel);text-align:right;white-space:nowrap}
.sched li.live{background:linear-gradient(90deg,var(--signal-soft),transparent 70%)}
.sched li.live .rel{color:var(--signal);font-weight:700;letter-spacing:.08em}
.copy-fallback{width:100%;min-height:120px;resize:vertical;background:var(--hull-2);border:1px solid var(--edge);padding:10px;font-family:var(--font-data);font-size:12.5px;color:var(--chrome)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:10px 16px;border:1px solid var(--edge-hi);background:var(--plate-3);color:var(--chrome);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background .2s,border-color .2s,color .2s}
.btn:hover:not(:disabled){border-color:var(--steel);background:var(--plate-2)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.btn-chrome{background:linear-gradient(180deg,var(--chrome),var(--steel));color:var(--on-chrome);border-color:var(--chrome)}
.btn-chrome:hover:not(:disabled){background:linear-gradient(180deg,var(--chrome),var(--chrome));color:var(--on-chrome)}
.btn-go{background:var(--signal);color:var(--on-chrome);border-color:var(--signal);box-shadow:0 0 18px var(--signal-soft)}
.btn-go:hover:not(:disabled){background:var(--signal-core);color:var(--on-chrome)}
.btn-sm{padding:7px 11px;font-size:13px}

.src{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;background:var(--hull-2);border:1px solid var(--rule)}
.src-pill{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--steel-dim);color:var(--steel)}
.src-pill.org{border-color:var(--signal-deep);color:var(--signal)}
.src-pill.local{border-color:var(--caution);color:var(--caution)}
.src-text{font-size:14.5px;color:var(--chrome);min-width:0}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:15px;color:var(--steel)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--chrome);line-height:1.3}
.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pat-group{grid-column:1/-1;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel-dim);margin-top:4px}
.pat{position:relative;display:grid;gap:7px;justify-items:start;text-align:left;cursor:pointer;padding:10px 10px 9px;background:var(--hull-2);border:1px solid var(--rule);transition:border-color .2s,background .2s}
.pat:hover{border-color:var(--edge-hi)}
.pat[aria-pressed="true"]{border-color:var(--chrome);background:var(--plate-3);box-shadow:inset 0 0 0 1px var(--chrome)}
.pat .dots{display:flex;gap:5px}
.pat .dot{width:11px;height:11px}
.pat .pl{font-size:13.5px;line-height:1.2;color:var(--chrome)}
.pat .tag{position:absolute;right:7px;top:7px;font-size:10px;font-weight:700;letter-spacing:.16em;padding:1px 5px;color:var(--on-chrome);background:var(--steel)}
.pat .tag.next{background:var(--chrome)}
.syncbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.syncbar .hint{font-size:14px;color:var(--steel);flex:1 1 220px;min-width:0}
.nudge{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nudge .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel-dim);margin-right:4px}
.offset{font-family:var(--font-data);font-size:14px;color:var(--steel);margin-left:4px}
.publish{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--rule)}
.publish-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel-dim)}
.field input{width:100%;padding:9px 11px;background:var(--hull-2);border:1px solid var(--edge);color:var(--chrome)}
.field input:focus{border-color:var(--steel)}
details.more{border-top:1px solid var(--rule);padding-top:12px}
details.more summary{cursor:pointer;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--steel);border-bottom:2px solid var(--steel);transform:rotate(-45deg);transition:transform .2s}
details.more[open] summary::before{transform:rotate(45deg)}
.more-body{display:grid;gap:12px;padding-top:12px}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--steel)}
.log li{display:flex;flex-wrap:wrap;gap:4px 10px}
.log b{color:var(--chrome);font-weight:600}

.toggles{display:grid;gap:0}
.trow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--rule)}
.trow:first-child{border-top:0}
.trow .tl{display:grid;gap:2px;min-width:0}
.trow .tl span{font-size:13.5px;color:var(--steel)}
.switch{flex:none;position:relative;width:46px;height:24px;border-radius:12px;border:1px solid var(--edge-hi);background:var(--hull-2);cursor:pointer;transition:background .2s,border-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--steel-dim);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--signal-soft);border-color:var(--signal-deep)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--signal);box-shadow:0 0 8px var(--signal-glow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;padding:5px 10px;border:1px solid var(--edge);background:var(--hull-2);color:var(--steel);font-family:var(--font-data);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--signal-deep);color:var(--signal);background:var(--signal-soft)}

.guide{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:g}
.guide li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.guide li::before{counter-increment:g;content:counter(g,decimal-leading-zero);font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;color:var(--steel-dim)}
.guide b{color:var(--chrome);font-weight:600}
.guide p{color:var(--steel);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--steel)}
.legend span{display:inline-flex;align-items:center;gap:7px}

.foot{display:grid;gap:6px;font-size:13px;color:var(--steel-dim);padding-top:6px;border-top:1px solid var(--rule)}
.foot p{margin:0;max-width:110ch}
.foot kbd{font-family:var(--font-data);font-size:12px;padding:1px 5px;border:1px solid var(--edge);color:var(--steel)}

/* ── toasts ────────────────────────────── */
.toasts{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:50;display:grid;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;padding:12px 14px 12px 16px;background:var(--plate-2);border:1px solid var(--edge-hi);border-left:3px solid var(--steel);box-shadow:0 14px 34px var(--shadow);display:grid;gap:2px;animation:toastIn .28s ease-out}
.toast.ok{border-left-color:var(--signal)}
.toast.warn{border-left-color:var(--caution)}
.toast.bad{border-left-color:var(--alert)}
.toast strong{font-weight:600;font-size:15px}
.toast span{font-size:13.5px;color:var(--steel)}
.toast.out{opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}


/* ── display mode (wall screen / stream): fits one screen ── */
.is-display .deck,.is-display .foot,.is-display .advice,.is-display #btn-full .lbl{display:none}
.is-display .shell{max-width:1680px;min-height:100vh;align-content:center;gap:clamp(12px,2.2vh,26px);padding-block:0 18px}
.is-display .console{grid-template-columns:minmax(220px,min(520px,60vh)) minmax(0,1fr);padding-block:0}
.is-display .dial-wrap{max-width:min(520px,60vh)}
.is-display .status{gap:clamp(10px,1.8vh,18px)}
.is-display{--lamp:clamp(54px,min(10vw,15vh),150px)}
.is-display .headline{font-size:clamp(52px,min(9vw,12.5vh),140px)}
.is-display .ro-val{font-size:clamp(38px,min(6vw,8.5vh),96px)}
.is-display .lamp-panel{padding-block:26px 14px}

@media (max-width:980px){
  .console{grid-template-columns:minmax(0,1fr)}
  .dial-wrap{max-width:340px}
  .is-display .console{grid-template-columns:minmax(0,1fr)}
  .is-display .dial-wrap{max-width:min(360px,42vh)}
  .is-display .shell{align-content:start}
  .deck{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:640px) and (max-width:980px){
  .console{grid-template-columns:minmax(190px,34%) minmax(0,1fr);gap:clamp(16px,3vw,32px)}
  .dial-wrap{max-width:330px}
  .is-display .console{grid-template-columns:minmax(190px,36%) minmax(0,1fr)}
  .is-display .dial-wrap{max-width:min(360px,60vh)}
  .headline{font-size:clamp(40px,6.4vw,64px)}
}
@media (max-width:560px){
  .readouts{grid-template-columns:minmax(0,1fr)}
  .clocks{gap:12px}
  .tool .lbl{display:none}
  .tool{padding:9px}
  .brand-sub{font-size:11px;letter-spacing:.1em}
  .lamp-panel{padding:28px 14px 14px}
  .lamp-ring{inset:-6px}
  .axis{font-size:12px}
  .sched li{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .sched .day{grid-column:1/-1}
  .panel-label span:last-child{display:none}
}
/* ── support the developer ─────────────── */
.support{padding:18px clamp(16px,2.4vw,26px);display:flex;flex-wrap:wrap;align-items:center;gap:14px clamp(18px,3vw,40px)}
.support-copy{flex:1 1 280px;min-width:0;display:grid;gap:4px}
.support-copy h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.support-copy p{margin:0;font-size:14.5px;color:var(--steel);max-width:60ch}
.support-copy b{color:var(--chrome);font-weight:600}
.ways{display:flex;flex-wrap:wrap;gap:10px;flex:2 1 520px;min-width:0}
.way{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 12px;background:var(--hull-2);border:1px solid var(--rule)}
.way-text{display:grid;gap:2px;min-width:0}
.way-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel-dim)}
.way-val{font-family:var(--font-data);font-size:14px;color:var(--chrome);white-space:nowrap}
.way-actions{display:flex;gap:6px;flex-wrap:wrap}
a.btn{text-decoration:none}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.clock-date .clock-val{font-family:var(--font-body);font-weight:600;letter-spacing:.04em}
.is-display .support{display:none}
.is-asleep *,.is-asleep *::before,.is-asleep *::after{animation-play-state:paused!important}
@media (max-width:560px){
  .way-val{white-space:normal;overflow-wrap:anywhere}
  .clock-date{display:none}
}
/* inside Discord: Discord provides its own pop-out and full-screen controls */
.in-discord #btn-full{display:none}
@media (prefers-reduced-motion:reduce){

/* ── cycle model ────────────────────────────────────────────── */
function buildModel(timing) {
  const t = cleanTiming(timing);
  const designMs = (t.openMin + t.resetMin + t.chargeMin) * MIN;
  const cycle = designMs + t.driftMs;
  const k = cycle / designMs;

  const os = t.openMin / 5, cs = t.chargeMin / 5;
  let st = [];
  for (let i = 0; i < 5; i++) st.push({ phase: 'open', greens: 5 - i, start: at(i * os), end: at((i + 1) * os) });
  st.push({ phase: 'reset', greens: 0, start: at(t.openMin), end: at(t.openMin + t.resetMin) });
  for (let i = 0; i < 5; i++) st.push({ phase: 'charging', greens: i, start: at(t.openMin + t.resetMin + i * cs), end: at(t.openMin + t.resetMin + (i + 1) * cs) });
  st[st.length - 1].end = cycle;
  st = st.filter(s => s.end - s.start > 1);
  st.forEach((s, i) => {
    s.i = i;
    s.lamps = [0, 1, 2, 3, 4].map(j => s.phase === 'reset' ? 'o' : (j < s.greens ? 'g' : (s.phase === 'open' ? 'o' : 'r')));

}
function statusAt(now, anchor, M) {
  const e = mod(now - anchor, M.cycle);

  const next = M.states[(s.i + 1) % M.states.length];
  return {
    now, e, cycleStart, state: s, next,
    changeAt: cycleStart + s.end,
    closeAt: cycleStart + M.openEnd,
    resetEndAt: cycleStart + M.resetEnd,
    nextOpenAt: cycleStart + M.cycle,

}
function patternLabel(s) {
  if (s.phase === 'open') return s.greens === 5 ? 'All 5 green · opens' : s.greens + ' green';
  if (s.phase === 'reset') return 'All dark · reset';
  return s.greens === 0 ? 'All 5 red' : s.greens + ' green · ' + (5 - s.greens) + ' red';
}
function changeText(s, n) {
  if (s.phase === 'open') {
    if (n.phase === 'open') return 'Light ' + s.greens + ' goes dark';
    return n.phase === 'reset' ? 'Last light goes dark · reset' : 'Charging starts';
  }
  if (s.phase === 'reset') return 'All five lights turn red';
  if (n.phase === 'charging') return 'Light ' + n.greens + ' turns green';

}

function computeEffective() {

/* ── dial ───────────────────────────────────────────────────── */

  M.states.forEach(st => {

  s += '<text class="arc-label"><textPath href="#arc-open" startOffset="50%" text-anchor="middle">Open · ' + M.timing.openMin + ' min</textPath></text>';
  s += '<text class="arc-label"><textPath href="#arc-chg" startOffset="50%" text-anchor="middle">Charging · ' + M.timing.chargeMin + ' min</textPath></text>';
  s += '<circle class="prog-track" cx="200" cy="200" r="150"/><path class="prog" id="dial-prog" d=""/>';
  s += '<g class="needle" id="needle"><line x1="200" y1="12" x2="200" y2="38"/><circle cx="200" cy="24" r="6"/></g>';

/* ── schedule ───────────────────────────────────────────────── */

  if (memo.get('sched-sig') === sig) return;
  memo.set('sched-sig', sig);
  const wins = windowsFrom(st, 8);
  scheduleCache = wins;
  E.sched.innerHTML = wins.map(w => {
    const live = now >= w.open && now < w.close;
    return '<li class="' + (live ? 'live' : '') + '"><span class="day">' + esc(dayLabel(w.open, now)) + '</span>' +
      '<span class="win">' + esc(hm(w.open)) + ' <span>→</span> ' + esc(hm(w.close)) + '</span>' +
      '<span class="rel">' + (live ? 'OPEN NOW' : esc(fmtRel(w.open - now))) + '</span></li>';
  }).join('');
  const per = Math.round(MODEL.cycle / MIN);

/* ── events ─────────────────────────────────────────────────── */

function checkEvents(st) {

  if (!prev || st.now - prev.t > 10 * SEC || st.now < prev.t) return;
  const s = st.state;
  if (prev.i !== s.i) {
    if (s.phase === 'open' && s.greens === 5) { if (prefs.openAlert) { toast('Hangar open', 'ok', 'All five lights green. Window closes at ' + hm(st.closeAt) + '.'); sfx('open'); } else if (prefs.blip) sfx('blip'); }
    else if (s.phase === 'reset') { toast('Reset started', 'bad', 'Clear the hangar. Reset ends at ' + hm(st.resetEndAt) + '.', 10000); sfx('alarm'); }
    else if (s.phase === 'charging' && s.greens === 0) { toast('Charging', '', 'All lights red. Next opening ' + hm(st.nextOpenAt) + '.'); if (prefs.blip) sfx('blip'); }
    else if (prefs.blip) sfx('blip');
  }
  if (s.phase !== 'open') {
    const until = st.nextOpenAt - st.now, prevUntil = prev.nextOpenAt - prev.t;
    prefs.leads.forEach(L => {
      const th = L * MIN, key = st.nextOpenAt + ':' + L;

        alertedKeys.add(key);
        toast('Opens in ' + L + ' min', 'warn', 'Doors open at ' + hm(st.nextOpenAt) + '. Head to PYAM-EXHANG-0-1.', 9000);
        sfx('lead');

  (HOST ? ls : ss).set(KEY.display, displayOn);
  try { history.replaceState(null, '', displayOn ? '#display' : location.pathname + location.search); } catch (e) { /* framed */ }
  if (displayOn && prefs.wake && !wakeLock) requestWake(true);
  requestAnimationFrame(layoutRail);
  if (displayOn && !quiet) toast('Display mode', '', 'Press D or Esc to leave. Add #display to the link to open straight into it.', 4000);
}
function toggleFull() {
  if (HOST) { hostCall('mcFullscreen'); return; }
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen().catch(() => {}); return; }
  const el = d.documentElement;
  const p = el.requestFullscreen ? el.requestFullscreen() : null;
  if (!p) { toast('Fullscreen isn’t available in this view', 'warn', 'Use display mode, or open the page in its own tab.'); return; }
  p.catch(() => toast('Fullscreen isn’t available in this view', 'warn', 'Use display mode, or open the page in its own tab.'));
}

/* ── sync actions ───────────────────────────────────────────── */
function pushSchedule() {
  if (!HOST || !EFF || !MODEL) return;
  hostCall('mcSchedule', {
    anchorMs: EFF.anchor, timing: MODEL.timing, leads: prefs.leads.slice(),
    resetWarn: !!prefs.resetWarn, openAlert: !!prefs.openAlert, sound: !!prefs.sound
  });
}
function refreshModel() {
  const prevTiming = MODEL ? MODEL.timing : null;
  computeEffective();
  if (!prevTiming || !sameTiming(prevTiming, MODEL.timing)) { buildDial(); buildRail(); buildPatterns(); }
  lastSnap = null; lastStateI = null;
  memo.delete('axis-sig'); memo.delete('sched-sig'); memo.delete('pat-sig');
  renderSource();
  render(Date.now());
  pushSchedule();
}
function syncNow() {
  if (armed == null) return;
  const T = Date.now();
  const st = MODEL.states[armed];
  const newAnchor = T - st.start;
  const shift = signedMod(newAnchor - EFF.anchor, MODEL.cycle);
  setLocal(newAnchor, MODEL.timing, 'Synced on “' + patternLabel(st) + '”');
  const big = Math.abs(shift) > 20 * MIN;
  toast('Synced · ' + fmtShift(shift), big ? 'warn' : 'ok',
    big ? 'That is a large correction. Check you picked the pattern that just appeared.' : (ART && !readOnly && canWrite !== false ? 'Applied on this device. Publish it to update every viewer.' : 'Applied on this device.'), 8000);
  armed = null; renderArmed();
}
function nudge(ms) {
  setLocal(EFF.anchor + ms, MODEL.timing, 'Fine-tuned');
}
function applyAdvanced(t) {
  const clean = cleanTiming(t);
  setLocal(EFF.anchor, clean, 'Cycle set to ' + clean.openMin + '/' + clean.resetMin + '/' + clean.chargeMin + ' min');
  toast('Cycle updated on this device', 'ok', (clean.openMin + clean.resetMin + clean.chargeMin) + ' min + ' + clean.driftMs + ' ms. Sync once at the hangar to anchor it.');
}

/* ── publishing (artifact capability) ───────────────────────── */
function headReset() {
  try {
    const st = Array.from(document.head.querySelectorAll('style')).find(s => !s.id && /safe-area-inset/.test(s.textContent) && /\[hidden\]/.test(s.textContent));
    if (st && st.textContent.trim()) return st.textContent;
  } catch (e) { /* fall through */ }
  return RESET_FALLBACK;
}
function buildDocument(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + headReset() + '</style></head><body>' +
    '<title>' + TITLE + '</title>' + FONT_LINKS +
    '<style id="mc-style">' + document.getElementById('mc-style').textContent + '</style>' +
    '<div id="app"></div>' +
    '<script id="mc-logo">' + document.getElementById('mc-logo').textContent + '<\/script>' +
    '<script type="application/json" id="mc-state">' + json + '<\/script>' +
    '<script id="mc-app">' + document.getElementById('mc-app').textContent + '<\/script>' +
    '</body></html>';
}
async function publishOrg(retried) {
  if (!ART || publishing || EFF.origin !== 'local') return;
  const now = Date.now();
  const callsign = cleanText(E.callsign.value, 32);
  prefs.callsign = callsign; savePrefs();
  const anchor = EFF.anchor + Math.floor((now - EFF.anchor) / MODEL.cycle) * MODEL.cycle;
  const next = {
    v: 1, anchorMs: Math.round(anchor), timing: MODEL.timing, source: 'org', updatedAt: now, by: callsign, patch: PUB.patch,
    history: [{ at: now, by: callsign, shiftMs: Math.round(offsetVsPub()), what: EFF.what || 'Synced' }].concat(PUB.history).slice(0, 8)
  };
  publishing = true; E.btnPublish.textContent = 'Publishing…'; renderPublish();
  ss.set(KEY.flash, { title: 'Org timing published', sub: 'Every open view now runs on this sync.', at: now });
  try {
    await ART.publish(buildDocument(next));
    ls.del(KEY.local);
  } catch (err) {
    ss.del(KEY.flash);
    publishing = false; E.btnPublish.textContent = 'Publish to all viewers';
    const code = err && err.code;
    if (code === 'conflict') {
      toast('Someone published first', '', 'Loading their timing now. Your calibration stays on this device until then.');
    } else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) >= 0) {
      readOnly = true;
      toast('This view is read-only', 'warn', 'Your sync stays on this device.');
    } else if (code === 'rate_limited') {
      toast('Publishing too often', 'warn', 'Wait a minute, then publish again.');
    } else if (['too_large', 'invalid_content', 'transform_error'].indexOf(code) >= 0) {
      toast('Publish refused (' + code + ')', 'bad', 'Your sync stays on this device.');
    } else if (!retried) {
      setTimeout(() => publishOrg(true), 1200 + Math.random() * 1600);
      return;
    } else {
      toast('Could not reach the server', 'bad', 'Your sync stays on this device. Try publishing again in a moment.');
    }
    renderPublish();
  }
}
async function initCaps() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { capsChecked = true; renderPublish(); return; }
  try { ART = await cl.use('artifact'); } catch (e) { ART = null; }
  try {
    const u = await cl.use('user');
    if (u && typeof u.canEdit === 'function') canWrite = await u.canEdit();
  } catch (e) { canWrite = null; }
  capsChecked = true;
  renderPublish();
}

/* ── copy for Discord ───────────────────────────────────────── */
function discordText() {
  const now = Date.now();
  const st = statusAt(now, EFF.anchor, MODEL);
  const wins = windowsFrom(st, 6);
  const u = ts => Math.floor(ts / 1000);
  let txt = '**' + ORG + ' · PYAM Exec Hangar openings**\n';
  wins.forEach(w => { txt += '• Opens <t:' + u(w.open) + ':f> (<t:' + u(w.open) + ':R>) · closes <t:' + u(w.close) + ':t>\n'; });
  txt += '_Insert compboards only while no light is red. Out before the reset._';
  return txt;
}
function copyText(txt) {
  if (HOST) return hostCall('mcCopy', txt).then(r => r !== null);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => true, () => false);
  } catch (e) { /* fall through */ }
  return Promise.resolve(false);
}
function copyDiscord() {
  const txt = discordText();
  const done = () => { E.copyFallback.hidden = true; toast('Copied for Discord', 'ok', 'Times show in each reader’s own time zone.'); };
  const fallback = () => {
    E.copyFallback.value = txt; E.copyFallback.hidden = false; E.copyFallback.focus(); E.copyFallback.select();
    toast('Copy it from the box', 'warn', 'This view blocked the clipboard. The text is selected, press Ctrl+C or ⌘C.');
  };
  copyText(txt).then(ok => ok ? done() : fallback());
}
function copyValue(btn) {
  const v = btn.dataset.copy, label = btn.dataset.copyLabel || 'Text';
  copyText(v).then(ok => {
    if (ok) { toast(label + ' copied', 'ok', v, 3500); return; }
    toast('Copy it by hand', 'warn', v + ' · this view blocked the clipboard.', 7000);
  });
}

/* ── wire up ────────────────────────────────────────────────── */
function bind() {
  E.btnSound.addEventListener('click', () => setSound(!prefs.sound));
  E.swSound.addEventListener('click', () => setSound(!prefs.sound));
  E.btnTest.addEventListener('click', () => { const was = prefs.sound; audio(); SFX.open(); setTimeout(SFX.alarm, 900); if (!was) toast('Sound is off', '', 'This was a test. Turn Sound on to hear alerts.', 3500); });
  E.btnDisplay.addEventListener('click', () => setDisplay(!displayOn));
  E.btnFull.addEventListener('click', toggleFull);
  E.swReset.addEventListener('click', () => { prefs.resetWarn = !prefs.resetWarn; savePrefs(); renderToggles(); });
  E.swBlip.addEventListener('click', () => { prefs.blip = !prefs.blip; savePrefs(); renderToggles(); });
  E.swOpen.addEventListener('click', () => { prefs.openAlert = !prefs.openAlert; savePrefs(); renderToggles(); });
  if (HOST) {
    const nat = (key, el) => el.addEventListener('click', () => {
      const on = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', String(on));
      hostCall('mcNative', key, on).then(s => { if (s) { NATIVE = s; } renderToggles(); });
    });
    nat('notify', E.swNotify); nat('background', E.swBg);
    if (E.swAuto) nat('autostart', E.swAuto);
    if (E.btnStartup) E.btnStartup.addEventListener('click', () => hostCall('mcStartupSettings'));
    E.btnTestNotify.addEventListener('click', () => {
      hostCall('mcNotify', 'Exec Hangar test', 'Notifications work. You will get one when the hangar opens.');
      toast('Test notification sent', 'ok', 'Check the bottom-right of your screen. If nothing shows, allow notifications for this app in Windows Settings.', 7000);
    });
    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (/^https:\/\//i.test(href)) { e.preventDefault(); hostCall('mcOpen', href); }
    });
  }
  if (SITE) {
    document.addEventListener('click', e => {
      const d = discord();
      if (!d) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!/^https:\/\//i.test(href)) return;
      e.preventDefault();
      d.openExternal(href).then(ok => { if (!ok) toast('Link not opened', 'warn', href, 7000); });
    });
  }
  $$('[data-copy]').forEach(b => b.addEventListener('click', () => copyValue(b)));
  E.swWake.addEventListener('click', () => {
    prefs.wake = !(prefs.wake && wakeLock); savePrefs();
    if (prefs.wake) requestWake(false); else { releaseWake(); renderToggles(); }
  });
  E.leads.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const n = Number(b.dataset.lead), i = prefs.leads.indexOf(n);
    if (i >= 0) prefs.leads.splice(i, 1); else prefs.leads.push(n);
    savePrefs(); renderToggles();
  });
  E.patterns.addEventListener('click', e => {
    const b = e.target.closest('.pat'); if (!b) return;
    const i = Number(b.dataset.i);
    armed = armed === i ? null : i; renderArmed();
    if (armed != null) E.btnSync.focus({ preventScroll: true });
  });
  E.btnSync.addEventListener('click', syncNow);
  $$('[data-nudge]').forEach(b => b.addEventListener('click', () => nudge(Number(b.dataset.nudge))));
  E.btnRevert.addEventListener('click', () => { ls.del(KEY.local); refreshModel(); toast('Back on ' + (PUB.source === 'org' ? 'org' : 'community') + ' timing', 'ok'); });
  E.btnPublish.addEventListener('click', () => publishOrg(false));
  E.callsign.addEventListener('change', () => { prefs.callsign = cleanText(E.callsign.value, 32); savePrefs(); });
  E.btnAdvApply.addEventListener('click', () => applyAdvanced({ openMin: E.tOpen.value, resetMin: E.tReset.value, chargeMin: E.tCharge.value, driftMs: E.tDrift.value }));
  E.btnAdvDefault.addEventListener('click', () => applyAdvanced(DEFAULT_TIMING));
  E.btnCopy.addEventListener('click', copyDiscord);

  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'd') { setDisplay(!displayOn); e.preventDefault(); }
    else if (k === 's') { setSound(!prefs.sound); e.preventDefault(); }
    else if (k === 'f') { toggleFull(); e.preventDefault(); }
    else if (k === 'escape' && displayOn) { setDisplay(false); }
  });
  /* resume suspended audio on the first gesture after a reload */
  document.addEventListener('pointerdown', () => { if (prefs.sound) audio(); }, { once: true, capture: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      lastSnap = null;
      if (prefs.wake && !wakeLock && (displayOn || prefs.wake)) requestWake(true);
      render(Date.now());
    }
  });
  if (!HOST) window.addEventListener('storage', e => {
    if (e.key === KEY.local) refreshModel();
    if (e.key === KEY.prefs) { prefs = loadPrefs(); buildFormatters(); memo.clear(); renderToggles(); renderSource(); render(Date.now()); }
  });
  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layoutRail); });
}

/* ── boot ───────────────────────────────────────────────────── */
/* live timing feed (Windows app fetches exec.xyxyll.com natively) */
function validFeed(f) { return !!(f && Number.isFinite(f.anchorMs) && f.timing && Number.isFinite(f.fetchedAt)); }
function applyFeed(f) {
  if (!validFeed(f) || PUB.source === 'org') return false;
  PUB.anchorMs = f.anchorMs;
  PUB.timing = cleanTiming(f.timing);
  PUB.updatedAt = Math.round(f.anchorMs);
  PUB.feedAt = f.fetchedAt;
  PUB.feedSrc = cleanText(f.source, 40) || 'exec.xyxyll.com';
  return true;
}
function installHostHooks() {
  if (!HOST) return;
  window.mcOnFeed = f => {
    const prevA = PUB.anchorMs, prevT = PUB.timing;
    if (!applyFeed(f)) return;
    const changed = prevA !== PUB.anchorMs || !sameTiming(prevT, PUB.timing);
    refreshModel();
    if (changed && booted) toast('Timing updated from the live feed', 'ok', 'The cycle was re-anchored, usually after a patch. Countdowns now follow it.', 9000);
  };
  window.mcOnNative = s => { if (s && typeof s === 'object') { NATIVE = s; renderToggles(); } };
  window.mcOnVisibility = vis => {
    asleep = !vis;
    document.documentElement.classList.toggle('is-asleep', asleep);
    if (vis) { lastSnap = null; render(Date.now()); }
  };
}
function siteFeed() {
  if (!SITE) return;
  const load = () => fetch('./feed.json?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(f => {
      if (!f || !validFeed(f)) return;
      const prevA = PUB.anchorMs, prevT = PUB.timing;
      if (!applyFeed(f)) return;
      const changed = prevA !== PUB.anchorMs || !sameTiming(prevT, PUB.timing);
      refreshModel();
      if (changed && booted && lastFeedToast) toast('Timing updated from the live feed', 'ok', 'The cycle was re-anchored, usually after a patch. Countdowns now follow it.', 9000);
      lastFeedToast = true;
    })
    .catch(() => { /* offline or file missing: keep built-in timing */ });
  load();
  setInterval(load, 30 * MIN);
}
let lastFeedToast = false;
function start(data) {
  buildFormatters();
  if (HOST && HOST.feed) applyFeed(HOST.feed);
  installHostHooks();
  computeEffective();
  buildDial(); buildRail(); buildPatterns();
  bind();
  renderToggles();
  renderSource();
  render(Date.now());
  layoutRail();

  let wantDisplay = false;
  try { wantDisplay = location.hash === '#display'; } catch (e) { /* framed */ }
  if (data && typeof data.display === 'boolean') wantDisplay = wantDisplay || data.display;
  if ((HOST ? ls : ss).get(KEY.display, false)) wantDisplay = true;
  if (wantDisplay) setDisplay(true, true);

  const flash = ss.get(KEY.flash, null);
  if (flash && Date.now() - flash.at < 120000) { toast(flash.title, 'ok', flash.sub, 7000); }
  ss.del(KEY.flash);

  let lastRender = 0;
  setInterval(() => {
    const now = Date.now();
    if (asleep && now - lastRender < 5000) return;
    lastRender = now;
    render(now);
  }, 250);
  window.addEventListener('hashchange', () => { try { setDisplay(location.hash === '#display', true); } catch (e) { /* framed */ } });
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ display: displayOn })); } catch (e) { /* no viewer hook */ }
  if (prefs.wake && (displayOn || HOST)) requestWake(true);
  pushSchedule();
  if (!HOST && !SITE) initCaps(); else capsChecked = true;
  siteFeed();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
} catch (e) {
  start({});
}
})();
